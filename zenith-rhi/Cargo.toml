[package]
name = "zenith-rhi"
version = "0.1.0"
edition = "2024"

[features]
# Enable shader debug printf support (VK_EXT_debug_printf)
# Only works in debug builds with validation layers enabled
shader_debug_print = []

[dependencies]
ash = { workspace = true }
winit = { workspace = true }
anyhow = { workspace = true }
profiling = { workspace = true }
derive_builder = { workspace = true }
paste = { workspace = true }
parking_lot = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }

shader-slang = { git = "https://github.com/FloatyMonkey/slang-rs" }

memoffset = "0.9"
ash-window = "0.13"
raw-window-handle = "0.6"
enumflags2 = "0.7"

zenith-core = { path = "../zenith-core" }
zenith-rhi-derive = { path = "../zenith-rhi-derive" }